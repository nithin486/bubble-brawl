<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3a1f8f" />
    <meta name="description" content="Grab it, steal it, bank it. A carry-and-bank party brawler." />
    <title>Bubble Brawl</title>
    <style>
      html,body{margin:0;height:100%;background:#2a1670;overflow:hidden}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(circle at 50% 40%,#7b4dff 0%,#3a1f8f 55%,#1d0d52 100%);color:#fff;font:700 18px system-ui,sans-serif;z-index:50;transition:opacity .4s}
      #boot .logo{font:900 44px system-ui,sans-serif;letter-spacing:1px;text-shadow:0 4px 0 #1d0d52,0 0 24px #ff8fd8}
      #boot .bar{width:220px;height:12px;border-radius:8px;background:#1d0d52;overflow:hidden;box-shadow:inset 0 2px 4px #0006}
      #boot .bar i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#ffd84a,#ff9a3d);border-radius:8px;transition:width .2s}
    </style>
  </head>
  <body>
    <div id="boot"><div class="logo">Bubble Brawl</div><div class="bar"><i id="bootbar"></i></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
